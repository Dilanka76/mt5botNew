# EXPERIMENT ONLY — never run a bot on this file.
#
# THE BASELINE PLUS ONE THING: the range filter ON (really skipping).
#
# Everything else is byte-for-byte settings.experiment_m3_base.yaml, so
# the difference in the result IS the filter.
#
# Originally: 2026-09-24, the user, for
# about the fifth time: "most of the losses are coming with the
# consolidate sideway range, that's the big problem." He watched it
# happen on 22-23 September -- 15 straight losses on live2_m3 while gold
# moved $5 in ten hours.
#
# Every previous test of that idea (27 of them) ran on ONE MONTH of real
# trades, and that month happened to be a lucky one. The year backtest
# now says the base rule has no edge at all (-$0.13 a trade before
# commission), which means those comparisons were between two groups
# that both earned roughly nothing. They deserve a rerun over a year.
#
# This file is the live M3 rule as docs/STRATEGY_LIVE2.md describes it:
# EMA13/21 confirmed cross, immediate entry, swap on the opposite cross,
# no software stop, $30 broker backstop, M15 trend picking $6 or $8.
# settings.experiment_m3_range.yaml and settings.experiment_m3_consol.yaml
# are THIS FILE plus one filter block, so any difference between their
# results is that filter and nothing else.
#
#   python scripts/backtest.py --account demo2_m3 \
#       --settings-path config/settings.experiment_m3_range.yaml \
#       --from 2025-11-01 --to 2026-09-01
#
# (M3 history does not reach back past November 2025.)

mt5:
  timeout_ms: 10000

symbol: XAUUSDp
timeframe: M3
candles_to_fetch: 500
tick_poll_interval_seconds: 1

ema_periods:
  fast: 5
  mid: 13
  slow: 21

# Large on purpose: the gap/EMA5-pullback wait was removed from the live
# strategy, so every confirmed cross enters immediately.
gap_threshold_usd: 999.0

take_profit_usd: 6.0             # against the M15 trend
htf_trend_timeframe: M15
htf_trend_take_profit_usd: 8.0   # running with it
stop_loss_usd: null              # the opposite cross IS the stop
broker_backstop_usd: 30.0
breakeven_trigger_usd: null

strategy_variant: dual_cross_confirmed_swap

sessions:
  dual_cross_confirmed_swap:
    - {start: "04:00", end: "01:29"}

position_sizing:
  - {max_balance: 50, lots: 0.01}
  - {max_balance: 100, lots: 0.02}
  - {max_balance: 200, lots: 0.03}
  - {max_balance: 300, lots: 0.04}
  - {max_balance: 1000, lots: 0.06}
  - {max_balance: null, lots: 0.12}

execution:
  mode: shadow
  require_demo_account: true
  magic_number: 990031
  order_deviation_points: 20
  order_comment: experiment-m3-range
  reject_manual_trades: false

logging:
  log_dir: logs
  level: WARNING

kill_switch:
  file_path: KILL_SWITCH

# THE FILTER UNDER TEST -- the trader-drawn range, frozen 2026-09-21 and
# never tuned since. A ceiling is two swing highs within 0.35 ATR of each
# other, a floor likewise, both read from the last 16 CLOSED M15 candles
# (4 hours). An entry priced between them is INSIDE the range and is
# skipped. shadow_only false = really skip. Exits are never blocked.
# Definition: bot/indicators/range_filter.py. DO NOT TUNE THESE NUMBERS
# to improve the result -- that is how this project lost $192 on the
# colour filter.
range_filter:
  enabled: true
  timeframe: M15
  lookback: 16
  fractal: 2
  level_tolerance_atr: 0.35
  shadow_only: false
