# Per-account config. Copy this file to config/settings.<account>.yaml for
# each account you run, e.g.:
#   cp config/settings.demo1.example.yaml config/settings.demo1.yaml
#   cp config/settings.demo1.example.yaml config/settings.demo2.yaml
#   cp config/settings.demo1.example.yaml config/settings.live1.yaml
#   cp config/settings.demo1.example.yaml config/settings.live2.yaml
#   cp config/settings.demo1.example.yaml config/settings.live3.yaml
# and adjust per account (e.g. different lot sizing or session windows).
# Secrets (MT5 login/password) live in .env.<account>, not here.

mt5:
  # Only needed if MT5_LOGIN/MT5_PASSWORD are set in .env.<account>. If MT5
  # is already running and logged in, the bot just attaches to it.
  timeout_ms: 10000

symbol: XAUUSDp
timeframe: M1               # strategy is defined on the 1-minute chart
candles_to_fetch: 500        # history pulled each cycle, enough to warm up EMA21
tick_poll_interval_seconds: 1  # how often live bid price is checked for EMA5 touch / TP fills

ema_periods:
  fast: 5
  mid: 13
  slow: 21

gap_threshold_usd: 5.0   # |close - EMA13| at the cross candle: below this, enter immediately
take_profit_usd: 5.0     # distance from entry to TP, in price (XAUUSD is quoted in USD)

# Optional dollar stop-loss, checked every tick alongside the existing
# opposite-cross exit — whichever happens first closes the trade. null
# (default) = no stop-loss, matching historical behavior (docs/STRATEGY.md
# #6). Bot-managed, not broker-side: only takes effect while main.py is
# actually running.
stop_loss_usd: null

# Optional breakeven-stop: once a trade has moved this many dollars in its
# favor, a return to the entry price becomes an additional exit condition,
# alongside the existing take-profit and opposite-cross exits. null
# (default) = off. Bot-managed, not broker-side — see docs/STRATEGY.md #10.
breakeven_trigger_usd: null

# gap_threshold -> small gap enters immediately, large gap (>= gap_threshold_usd) waits for EMA5 touch (current live behavior)
# ema5_only     -> ignores gap_threshold_usd entirely; every cross always waits for an EMA5 touch before entering
strategy_variant: gap_threshold

# Sri Lanka time (Asia/Colombo, fixed UTC+5:30, no DST). No NEW trades open
# outside these windows; an already-open trade is left to run to its natural
# TP or EMA-cross exit regardless of session end. Each strategy_variant has
# its own schedule — only the one matching the active strategy_variant above
# is used. Different accounts can use different windows by editing this
# file per account.
sessions:
  gap_threshold:
    - {start: "04:00", end: "08:00"}
    - {start: "12:00", end: "23:00"}
  ema5_only:
    - {start: "04:00", end: "23:00"}
  dual_cross:
    - {start: "04:00", end: "08:00"}
    - {start: "12:00", end: "16:00"}
    - {start: "19:00", end: "22:00"}
  dual_cross_confirmed_entry:
    - {start: "04:00", end: "08:00"}
    - {start: "12:00", end: "16:00"}
    - {start: "19:00", end: "22:00"}
  dual_cross_tight_exit:
    - {start: "04:00", end: "08:00"}
    - {start: "12:00", end: "16:00"}
    - {start: "19:00", end: "22:00"}

# Only read if strategy_variant is dual_cross. See
# docs/STRATEGY_DUAL_CROSS_SPEC.md and state_machine_dual_cross.py.
# dual_cross:
#   cross_tolerance_usd: 0.02
#   max_concurrent_positions: 2
#   require_hedging_account: true

# Only read if strategy_variant is dual_cross_confirmed_entry — a
# dual_cross variant that enters ONLY on an already-confirmed candle-close
# cross (no tick-based tolerance entry), and closes the current position
# tick-first (within closing_tolerance_usd) with candle-close confirmation
# as a fallback. See state_machine_dual_cross_confirmed_entry.py's module
# docstring — holds at most one position at a time, unlike dual_cross.
# dual_cross_confirmed_entry:
#   closing_tolerance_usd: 0.02

# Only read if strategy_variant is dual_cross_tight_exit — built 2026-08-19
# directly from real-trade analysis of dual_cross's losses. Keeps
# dual_cross's tick-based entry (same cross_tolerance_usd), adds an
# early_exit_usd net that closes a not-yet-validated position early if
# price moves that far against it (instead of riding to the candle's
# close), and a "reversal swap" that closes ANY open position (validated
# or not) the instant a later candle confirms a genuine opposite cross.
# Holds at most one position at a time, like dual_cross_confirmed_entry.
# See state_machine_dual_cross_tight_exit.py's module docstring.
# dual_cross_tight_exit:
#   cross_tolerance_usd: 0.02
#   early_exit_usd: 3.0

# Fixed lot size by current account balance (not risk-% based). Ordered by
# ascending max_balance; the first tier whose max_balance >= balance applies.
# max_balance: null means "no upper bound" (> the previous tier's max).
# Adjust per account — e.g. smaller lots for live accounts than demo.
position_sizing:
  - {max_balance: 50, lots: 0.01}
  - {max_balance: 100, lots: 0.02}
  - {max_balance: 200, lots: 0.03}
  - {max_balance: 300, lots: 0.04}
  - {max_balance: 1000, lots: 0.06}
  - {max_balance: null, lots: 0.12}

execution:
  # shadow        -> evaluate + log signals, never send real orders (default, safe)
  # demo_execute  -> send real orders, but only if the connected account is confirmed DEMO
  # live_execute  -> send real orders on a real-money account (do not enable until fully tested)
  mode: demo_execute
  require_demo_account: true
  magic_number: 900002   # use a distinct magic number per account if they ever share a symbol/server
  order_deviation_points: 20
  order_comment: ema-scalp
  # Force-closes any position on this symbol that isn't the bot's own
  # (matched by magic number) — i.e. anything opened by hand in the MT5
  # terminal. Protects against manual intervention during live trading;
  # leave false on demo accounts if you want to place manual test trades.
  reject_manual_trades: false

logging:
  log_dir: logs   # actual logs go to logs/<account>/ — the account name is appended automatically
  level: INFO

kill_switch:
  file_path: KILL_SWITCH   # actual file is KILL_SWITCH_<account> in the project root — the account name is appended automatically