# demo1_test — the SAME rule as demo2_test with ONE difference: the target.
#
# 2026-09-27. The two demo accounts are now an A/B test instead of two
# copies of the same thing, which is the only way two accounts are worth
# more than one:
#
#     demo2_test   EMA5/9 on M1, target $1.00, stop $2.50
#     demo1_test   EMA5/9 on M1, target $1.50, stop $2.50
#
# Everything else is identical -- same entry, same stop, same lot ladder,
# same hours. So any difference between the two accounts in a week's time
# is the TARGET and nothing else.
#
# What the difference should do, written down before it runs: a bigger
# target is hit less often but pays more when it lands. $1.00 wins more
# trades; $1.50 wins fewer. Which is better depends on whether the extra
# 50c arrives more often than the extra misses cost -- and the $2.50 stop
# is the same on both, so the losses should be comparable.
#
# NO REAL MONEY. Demo-only by three locks: mode demo_execute,
# require_demo_account true, and a magic number nothing else uses.
mt5:
  timeout_ms: 10000

symbol: XAUUSDp
timeframe: M1
candles_to_fetch: 500
tick_poll_interval_seconds: 1

# mid/slow ARE the cross. Setting them to 5 and 9 makes this his EMA5/EMA9
# rule with no code change -- bot/indicators/ema.py names the columns
# ema13/ema21 but computes them from these periods.
# mid/slow ARE the cross: EMA3 x EMA9. `fast` is the line the pullback
# waits for, so it is 3 as well -- the columns are still named ema5/ema13
# in the code, but they hold EMA3 here. reversal_slow stays 9.
ema_periods:
  fast: 3
  mid: 3
  slow: 9
  reversal_slow: 9

# ZERO on purpose, changed 2026-09-30. calculate: the engine enters
# immediately when |close - EMA3| is BELOW this, and otherwise waits for
# price to come back and touch EMA3. At 0 the immediate path can never
# fire, so EVERY confirmed cross becomes a pending setup that only enters
# on the pullback. Expect noticeably fewer trades: a setup is cancelled if
# the opposite cross confirms before price returns.
gap_threshold_usd: 0.0

take_profit_usd: 1.0
# A $2.50 stop, added 2026-09-27 at his request. It is the FIRST stop this
# rule has ever had: before, a loser ran until the opposite cross, which
# the simulation measured at an average of -$2.39 and sometimes far worse.
# Whichever comes first now closes the trade -- the stop, the target, or
# the cross.
stop_loss_usd: 2.5
broker_backstop_usd: 30.0    # disaster insurance only, and the config requires one
# Once floating profit reaches $0.90, the stop moves to entry + $0.10 --
# one-way, it never un-arms. The $2.50 stop is the only protection before
# that point.
#
# READ THIS BEFORE TRUSTING THE $0.10: both the trigger and the exit are
# checked by the BOT, once per second, and the stop lives in the bot's
# memory rather than at the broker. So a spike to +$0.95 that retreats
# inside one second is missed, the close is a market order that can fill a
# few cents worse, and nothing arms in the first 5 seconds of a trade
# (POSITION_CLOSE_GRACE_PERIOD_SECONDS in bot/strategy/state_machine.py).
# With a $0.12 spread and $0.06/oz commission already paid, +$0.10 gross is
# about +$0.04 net -- the value here is escaping a -$2.50 loss, not banking
# ten cents.
breakeven_trigger_usd: 0.9
breakeven_lock_usd: 0.1

strategy_variant: dual_cross_confirmed_swap

sessions:
  dual_cross_confirmed_swap:
    - {start: "04:00", end: "01:29"}

# demo1's OWN LADDER, set 2026-09-28 at his request -- deliberately
# different from demo2's, which keeps 0.01 per $10:
#
#     $0 - $50     -> 0.02
#     $50 - $100   -> 0.05
#     $100 - $200  -> 0.07
#     then +0.02 for every further $100:
#     $200-300 -> 0.09, $300-400 -> 0.11, $400-500 -> 0.13, ...
#
# The .99 tops are there because calculate_lots() takes the first tier
# whose max_balance is >= the balance, so a tier's top is INCLUSIVE.
#
# MARGIN, at this account's 1:500 where 0.01 lots costs $8.58:
#   $56  -> 0.05 = $42.90 of $56    (77%)
#   $150 -> 0.07 = $60.06 of $150   (40%)
#   $250 -> 0.09 = $77.22 of $250   (31%)
# It starts tight and gets steadily safer, which is the opposite of
# demo2's ladder -- that one holds 84% of the balance in margin at EVERY
# level and stops out on a move of a dollar or two an ounce.
position_sizing:
  - {max_balance: 49.99, lots: 0.02}
  - {max_balance: 99.99, lots: 0.05}
  - {max_balance: 199.99, lots: 0.07}
